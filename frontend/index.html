<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 吵架擂台</title>
  <!-- 使用 Tailwind CSS CDN，无需构建工具 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 自定义打字机动画：辩论内容追加时的光标闪烁效果 */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .typing-cursor::after {
      content: '▌';
      animation: blink 1s step-end infinite;
      color: #6366f1;
    }

    /* 发言卡片淡入动画 */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-enter {
      animation: fadeInUp 0.4s ease-out;
    }

    /* 辩论区滚动条美化 */
    .debate-panel::-webkit-scrollbar { width: 6px; }
    .debate-panel::-webkit-scrollbar-track { background: #f1f5f9; }
    .debate-panel::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

  <!-- ── 顶部标题栏 ── -->
  <header class="bg-indigo-700 text-white py-5 shadow-lg">
    <div class="max-w-6xl mx-auto px-4 text-center">
      <h1 class="text-3xl font-bold tracking-wide">🥊 AI 吵架擂台</h1>
      <p class="text-indigo-200 text-sm mt-1">
        正方：GLM4-9B &nbsp;|&nbsp; 反方：Qwen3.5-9B &nbsp;|&nbsp; 吃瓜裁判：Gemma4-E4B
      </p>
    </div>
  </header>

  <!-- ── 话题输入区 ── -->
  <section class="max-w-6xl mx-auto w-full px-4 mt-6">
    <div class="bg-white rounded-2xl shadow p-5 flex flex-col sm:flex-row gap-3 items-center">
      <label for="topicInput" class="text-slate-600 font-medium whitespace-nowrap">
        吵架话题：
      </label>
      <input
        id="topicInput"
        type="text"
        placeholder="例如：打工比创业更稳"
        class="flex-1 border border-slate-300 rounded-xl px-4 py-2 text-slate-800
               focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
      />
      <button
        id="startBtn"
        onclick="startDebate()"
        class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white
               font-semibold px-6 py-2 rounded-xl transition-all duration-150 whitespace-nowrap"
      >
        开始吵架
      </button>
    </div>
  </section>

  <!-- ── 状态栏 ── -->
  <div id="statusBar"
       class="max-w-6xl mx-auto w-full px-4 mt-3 text-center text-sm text-slate-500 hidden">
    <span id="statusText">准备中...</span>
  </div>

  <!-- ── 主辩论区：左（正方）右（反方）双栏 ── -->
  <main class="max-w-6xl mx-auto w-full px-4 mt-4 flex-1 flex gap-4">

    <!-- 正方区域 -->
    <div class="flex-1 flex flex-col">
      <div class="flex items-center gap-2 mb-2">
        <span class="w-3 h-3 rounded-full bg-blue-500"></span>
        <h2 class="font-bold text-slate-700">正方 <span class="text-xs text-slate-400 font-normal">（GLM4-9B）</span></h2>
      </div>
      <div id="proPanel"
           class="debate-panel bg-white rounded-2xl shadow p-4 flex-1 overflow-y-auto
                  min-h-[400px] max-h-[520px] flex flex-col gap-3">
        <!-- 正方发言卡片动态插入 -->
        <p class="text-slate-300 text-sm text-center mt-8 select-none">等待开吵…</p>
      </div>
    </div>

    <!-- 反方区域 -->
    <div class="flex-1 flex flex-col">
      <div class="flex items-center gap-2 mb-2">
        <span class="w-3 h-3 rounded-full bg-rose-500"></span>
        <h2 class="font-bold text-slate-700">反方 <span class="text-xs text-slate-400 font-normal">（Qwen3.5-9B）</span></h2>
      </div>
      <div id="conPanel"
           class="debate-panel bg-white rounded-2xl shadow p-4 flex-1 overflow-y-auto
                  min-h-[400px] max-h-[520px] flex flex-col gap-3">
        <!-- 反方发言卡片动态插入 -->
        <p class="text-slate-300 text-sm text-center mt-8 select-none">等待开吵…</p>
      </div>
    </div>

  </main>

  <!-- ── 裁判评语区（辩论结束后淡入） ── -->
  <section id="judgeSection"
           class="max-w-6xl mx-auto w-full px-4 mt-4 mb-8 hidden">
    <div class="flex items-center gap-2 mb-2">
      <span class="w-3 h-3 rounded-full bg-amber-500"></span>
      <h2 class="font-bold text-slate-700">吃瓜裁判点评 <span class="text-xs text-slate-400 font-normal">（Gemma4-E4B）</span></h2>
    </div>
    <div id="judgePanel"
         class="bg-amber-50 border border-amber-200 rounded-2xl shadow p-5 whitespace-pre-wrap
                text-slate-700 leading-relaxed text-sm">
    </div>
  </section>

  <!-- ── JavaScript 逻辑 ── -->
  <script>
    // ────────────────────────────────────────────
    // 全局状态
    // ────────────────────────────────────────────

    /** 当前是否正在进行辩论 */
    let isDebating = false;

    /** 当前 SSE 连接实例，用于在需要时手动关闭 */
    let currentEventSource = null;


    // ────────────────────────────────────────────
    // 工具函数
    // ────────────────────────────────────────────

    /**
     * 更新状态栏文字
     * @param {string} text  要显示的状态文字，传入空字符串则隐藏状态栏
     */
    function setStatus(text) {
      const bar = document.getElementById('statusBar');
      const span = document.getElementById('statusText');
      if (text) {
        bar.classList.remove('hidden');
        span.textContent = text;
      } else {
        bar.classList.add('hidden');
      }
    }

    /**
     * 设置"开始辩论"按钮状态
     * @param {boolean} loading  true = 禁用并显示加载文字，false = 恢复
     */
    function setButtonLoading(loading) {
      const btn = document.getElementById('startBtn');
      const input = document.getElementById('topicInput');
      if (loading) {
        btn.disabled = true;
        btn.textContent = '吵架进行中…';
        btn.classList.add('opacity-60', 'cursor-not-allowed');
        input.disabled = true;
      } else {
        btn.disabled = false;
        btn.textContent = '开始辩论';
        btn.classList.remove('opacity-60', 'cursor-not-allowed');
        input.disabled = false;
      }
    }

    /**
     * 清空辩论区，准备新一场辩论
     */
    function clearPanels() {
      const placeholder = '<p class="text-slate-300 text-sm text-center mt-8 select-none">等待开吵…</p>';
      document.getElementById('proPanel').innerHTML = placeholder;
      document.getElementById('conPanel').innerHTML = placeholder;
      document.getElementById('judgePanel').textContent = '';
      document.getElementById('judgeSection').classList.add('hidden');
    }

    /**
     * 向指定辩论区插入一张发言卡片
     * @param {string} panelId    容器 ID：'proPanel' 或 'conPanel'
     * @param {string} roundLabel 轮次标签，如 "第1轮：开场陈词"
     * @param {string} content    发言内容
     * @param {string} colorClass 卡片左边框颜色 Tailwind class
     */
    function appendSpeechCard(panelId, roundLabel, content, colorClass) {
      const panel = document.getElementById(panelId);

      // 首次插入时移除占位文字
      const placeholder = panel.querySelector('p.select-none');
      if (placeholder) placeholder.remove();

      // 构建卡片 HTML
      const card = document.createElement('div');
      card.className = `card-enter border-l-4 ${colorClass} bg-slate-50 rounded-xl p-3`;
      card.innerHTML = `
        <div class="text-xs font-semibold text-slate-400 mb-1">${escapeHtml(roundLabel)}</div>
        <div class="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">${escapeHtml(content)}</div>
      `;

      panel.appendChild(card);
      // 自动滚动到最新发言
      panel.scrollTop = panel.scrollHeight;
    }

    /**
     * 简单的 HTML 转义，防止 XSS（模型输出内容可能含 < > & 等字符）
     * @param {string} str
     * @returns {string}
     */
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }


    // ────────────────────────────────────────────
    // 核心流程：启动辩论
    // ────────────────────────────────────────────

    /**
     * 点击"开始辩论"时触发：
     * 1. 向后端 POST /debate 创建会话，获取 debate_id
     * 2. 建立 SSE 连接，实时接收辩论内容
     * 3. 根据消息类型更新 UI
     */
    async function startDebate() {
      // 防止重复触发
      if (isDebating) return;

      const topic = document.getElementById('topicInput').value.trim();
      if (!topic) {
        alert('请输入辩论话题！');
        return;
      }

      // 更新 UI 状态
      isDebating = true;
      setButtonLoading(true);
      clearPanels();
      setStatus('正在召唤 AI 选手，准备开吵…');

      try {
        // ── Step 1: 创建辩论会话 ──
        const resp = await fetch('/debate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic }),
        });

        if (!resp.ok) {
          const err = await resp.json();
          throw new Error(err.detail || '创建辩论会话失败');
        }

        const { debate_id } = await resp.json();

        // ── Step 2: 建立 SSE 连接 ──
        setStatus('架已开吵，请耐心等待…');

        // 关闭上一次可能残留的连接
        if (currentEventSource) currentEventSource.close();

        const es = new EventSource(`/debate/${debate_id}/stream`);
        currentEventSource = es;

        // ── Step 3: 处理 SSE 消息 ──
        es.onmessage = function(event) {
          let msg;
          try {
            msg = JSON.parse(event.data);
          } catch {
            console.warn('无法解析 SSE 消息：', event.data);
            return;
          }

          if (msg.type === 'speech') {
            // 正方或反方发言
            if (msg.speaker === '正方') {
              appendSpeechCard('proPanel', msg.round, msg.content, 'border-blue-400');
              setStatus(`正方说完了 — ${msg.round}`);
            } else if (msg.speaker === '反方') {
              appendSpeechCard('conPanel', msg.round, msg.content, 'border-rose-400');
              setStatus(`反方说完了 — ${msg.round}`);
            }

          } else if (msg.type === 'judge') {
            // 裁判评判：显示裁判区
            setStatus('裁判正在吃瓜点评…');
            const judgeSection = document.getElementById('judgeSection');
            const judgePanel = document.getElementById('judgePanel');
            judgePanel.textContent = msg.content;
            judgeSection.classList.remove('hidden');
            judgeSection.scrollIntoView({ behavior: 'smooth' });

          } else if (msg.type === 'done') {
            // 辩论全部完成
            setStatus('架吵完了！');
            setTimeout(() => setStatus(''), 3000);
            es.close();
            isDebating = false;
            setButtonLoading(false);

          } else if (msg.type === 'error') {
            // 发生错误
            setStatus(`❌ 错误：${msg.message}`);
            es.close();
            isDebating = false;
            setButtonLoading(false);
          }
        };

        es.onerror = function() {
          // SSE 连接异常断开
          if (isDebating) {
            setStatus('❌ 连接中断，请刷新页面重试');
            isDebating = false;
            setButtonLoading(false);
          }
          es.close();
        };

      } catch (err) {
        // 请求阶段的异常
        setStatus(`❌ 错误：${err.message}`);
        isDebating = false;
        setButtonLoading(false);
      }
    }

    // ── 支持回车键触发辩论 ──
    document.getElementById('topicInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') startDebate();
    });
  </script>

</body>
</html>
